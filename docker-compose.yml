version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: refarm_forms_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mysql://refarm_user:refarm_pass@mysql:3306/refarm_forms
      - UPLOAD_DIR=/app/uploads
      - PORT=3000
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - refarm_uploads:/app/uploads
    networks:
      - refarm-network

  mysql:
    image: mysql:8.0
    container_name: refarm_forms_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root_pass
      - MYSQL_DATABASE=refarm_forms
      - MYSQL_USER=refarm_user
      - MYSQL_PASSWORD=refarm_pass
    volumes:
      - refarm_mysql_data:/var/lib/mysql
    networks:
      - refarm-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_pass"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  refarm_uploads:
  refarm_mysql_data:

networks:
  refarm-network:
    driver: bridge
